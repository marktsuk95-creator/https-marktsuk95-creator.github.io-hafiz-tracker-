<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Hafiz Tracker</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #071317;
    --surface: #0D1F25;
    --surface-2: #12292F;
    --line: rgba(242, 236, 225, .08);
    --gold: #FFBD65;
    --gold-dim: rgba(255, 189, 101, .14);
    --mint: #46C9A7;
    --mint-dim: rgba(70, 201, 167, .14);
    --text: #F2ECE1;
    --muted: #8A9EA3;
    --radius: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: 'Manrope', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.4;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .ar { font-family: 'Amiri', serif; direction: rtl; }

  /* ---------- header ---------- */
  .top {
    position: relative;
    padding: 22px 16px 18px;
    overflow: hidden;
  }
  /* «حفظ» — хифз, крупно и едва заметно за шапкой */
  .top::before {
    content: 'حفظ';
    position: absolute; right: -14px; top: -38px;
    font-family: 'Amiri', serif; font-weight: 700; font-size: 168px; line-height: 1;
    direction: rtl;
    color: var(--gold);
    opacity: .07;
    pointer-events: none;
  }
  .top > * { position: relative; }
  .hello { font-size: 13px; color: var(--muted); }
  .name { font-size: 22px; font-weight: 800; letter-spacing: -.01em; margin-top: 2px; }
  .hijri { font-size: 12px; color: var(--gold); margin-top: 6px; letter-spacing: .02em; }
  .help-btn {
    position: absolute; right: 16px; top: 16px;
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--surface-2); color: var(--gold);
    font-weight: 800; font-size: 15px;
    display: grid; place-items: center;
  }
  .brand {
    position: absolute; right: 58px; top: 24px;
    font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted);
  }

  main { padding: 0 16px calc(96px + env(safe-area-inset-bottom)); }
  .tab { display: none; animation: fade .25s ease; }
  .tab.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
  }
  .section-title {
    font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted);
    margin: 26px 2px 10px;
  }

  /* ---------- hero ---------- */
  .hero { display: flex; align-items: center; gap: 18px; }
  .ring { position: relative; width: 124px; height: 124px; flex: none; }
  .ring svg { transform: rotate(-90deg); }
  .ring .track { stroke: var(--surface-2); }
  .ring .bar { stroke: var(--gold); stroke-linecap: round; transition: stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1); }
  .ring-label { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring-num { font-size: 30px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
  .ring-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .hero-side { flex: 1; min-width: 0; }
  .streak { display: flex; align-items: center; gap: 8px; }
  .streak-num { font-size: 26px; font-weight: 800; line-height: 1; }
  .streak-lbl { font-size: 12px; color: var(--muted); line-height: 1.2; }
  .flame { width: 26px; height: 26px; color: var(--gold); }
  .flame.off { color: var(--muted); opacity: .5; }
  .hero-meta { margin-top: 12px; font-size: 13px; color: var(--muted); }
  .hero-meta b { color: var(--text); font-weight: 700; }

  /* ---------- week ---------- */
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 14px; }
  .day {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 8px 0 9px; text-align: center;
  }
  .day.today { border-color: rgba(255,189,101,.5); }
  .day-w { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .day-n { font-size: 14px; font-weight: 700; margin: 2px 0 6px; }
  .day-bars { display: flex; justify-content: center; gap: 3px; }
  .day-bars i { width: 5px; height: 5px; border-radius: 50%; background: var(--surface-2); }
  .day-bars i.s.on { background: var(--gold); }
  .day-bars i.k.on { background: var(--mint); }
  .day-bars i.m.on { background: var(--text); }

  /* ---------- tasks ---------- */
  .task { display: flex; gap: 14px; align-items: flex-start; transition: border-color .2s; }
  .task + .task { margin-top: 10px; }
  .task.done { border-color: rgba(70,201,167,.45); }
  .task.done.sabak { border-color: rgba(255,189,101,.5); }
  .task-ic {
    width: 42px; height: 42px; border-radius: 13px; flex: none;
    display: grid; place-items: center;
  }
  .sabak .task-ic { background: var(--gold-dim); color: var(--gold); }
  .sabki .task-ic { background: var(--mint-dim); color: var(--mint); }
  .manzil .task-ic { background: rgba(242,236,225,.08); color: var(--text); }
  .task-ic svg { width: 22px; height: 22px; }
  .task-body { flex: 1; min-width: 0; }
  .task-head { display: flex; align-items: baseline; gap: 8px; }
  .task-title { font-weight: 800; font-size: 16px; }
  .task-tag { font-size: 12px; color: var(--muted); }
  .task-info { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .task-info b { color: var(--text); font-weight: 600; }
  .task-info .ar { font-size: 16px; color: var(--text); }
  .task-actions { display: flex; gap: 8px; margin-top: 12px; align-items: center; }

  .btn {
    height: 40px; padding: 0 16px; border-radius: 12px;
    font-weight: 700; font-size: 14px; white-space: nowrap;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: transform .12s, opacity .2s;
  }
  .btn:active { transform: scale(.96); }
  .btn-gold { background: var(--gold); color: #1B1206; }
  .btn-mint { background: var(--mint); color: #04201A; }
  .btn-ghost { background: var(--surface-2); color: var(--text); }
  .btn-sq { width: 40px; padding: 0; }
  .btn[disabled] { opacity: .35; pointer-events: none; }
  .count-pill {
    margin-left: auto; font-size: 13px; color: var(--muted);
  }
  .count-pill b { color: var(--gold); font-size: 18px; font-weight: 800; }

  .check {
    width: 30px; height: 30px; border-radius: 50%; flex: none;
    border: 2px solid var(--surface-2); display: grid; place-items: center;
    margin-left: auto; align-self: center;
    transition: background .2s, border-color .2s;
  }
  .check svg { width: 16px; height: 16px; opacity: 0; transition: opacity .2s; }
  .done .check { background: var(--mint); border-color: var(--mint); color: #04201A; }
  .done .check svg { opacity: 1; }

  .hint {
    margin-top: 14px; padding: 14px 16px; border-radius: var(--radius);
    background: linear-gradient(120deg, var(--gold-dim), transparent 80%);
    border: 1px solid rgba(255,189,101,.25);
    font-size: 13px; display: flex; gap: 12px; align-items: center;
  }
  .hint b { display: block; font-size: 14px; margin-bottom: 2px; }
  .hint .btn { margin-left: auto; flex: none; height: 34px; padding: 0 12px; font-size: 13px; }

  /* ---------- progress ---------- */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 4px; }
  .stat { padding: 14px 12px; }
  .stat-v { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
  .stat-l { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .forecast { margin-top: 8px; font-size: 13px; color: var(--muted); display: flex; gap: 10px; align-items: center; }
  .forecast b { color: var(--gold); }
  .forecast svg { width: 18px; height: 18px; color: var(--gold); flex: none; }

  .juz-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .juz {
    position: relative; aspect-ratio: 1; border-radius: 14px; overflow: hidden;
    background: var(--surface); border: 1px solid var(--line);
    display: grid; place-items: center;
    font-weight: 800; font-size: 17px;
    transition: transform .12s;
  }
  .juz:active { transform: scale(.94); }
  .juz .fill {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to top, rgba(255,189,101,.55), rgba(255,189,101,.25));
    transition: height .4s;
  }
  .juz.full { border-color: var(--gold); color: #1B1206; }
  .juz.full .fill { background: var(--gold); }
  .juz span { position: relative; }
  .legend { display: flex; gap: 14px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

  .seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 3px; margin-top: 10px; }
  .seg button { flex: 1; height: 36px; border-radius: 10px; font-size: 13px; font-weight: 700; color: var(--muted); }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 0 var(--line) inset; }
  .setting-l { font-weight: 700; }
  .setting-d { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .link-danger { margin-top: 18px; font-size: 13px; color: #E07A6B; font-weight: 600; }

  /* ---------- salah ---------- */
  .prayer { display: flex; align-items: center; gap: 14px; padding: 14px 16px; }
  .prayer + .prayer { margin-top: 8px; }
  .prayer-name { font-weight: 800; font-size: 16px; }
  .prayer-ar { font-size: 20px; color: var(--muted); margin-left: auto; margin-right: 6px; }
  .prayer .check { margin-left: 0; }
  .prayer.done { border-color: rgba(70,201,167,.45); }
  .prayer.done .prayer-ar { color: var(--mint); }
  .salah-sum { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
  .salah-sum .big { font-size: 34px; font-weight: 800; letter-spacing: -.03em; }
  .salah-sum .of { color: var(--muted); font-size: 14px; }
  .salah-sum .streak-mini { margin-left: auto; font-size: 13px; color: var(--muted); }
  .salah-sum .streak-mini b { color: var(--mint); }

  .sgrid { display: grid; grid-template-columns: 44px repeat(5, 1fr); gap: 6px; align-items: center; font-size: 12px; }
  .sgrid .h { color: var(--muted); text-align: center; font-weight: 700; }
  .sgrid .d { color: var(--muted); }
  .sgrid .d.t { color: var(--gold); font-weight: 700; }
  .sgrid .c { height: 22px; border-radius: 7px; background: var(--surface-2); }
  .sgrid .c.on { background: var(--mint); }

  /* ---------- nav ---------- */
  .nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex; justify-content: space-around;
    padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
    background: rgba(7,19,23,.86);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--line);
  }
  .nav button {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 700; color: var(--muted); padding: 6px 0;
    transition: color .2s;
  }
  .nav svg { width: 24px; height: 24px; }
  .nav button.on { color: var(--gold); }

  /* ---------- sheet ---------- */
  .backdrop {
    position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.55);
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
    max-height: 86vh; overflow-y: auto;
    background: var(--surface); border-radius: 24px 24px 0 0;
    border-top: 1px solid var(--line);
    padding: 10px 16px calc(24px + env(safe-area-inset-bottom));
    transform: translateY(100%); transition: transform .3s cubic-bezier(.2,.8,.2,1);
  }
  .sheet-open .backdrop { opacity: 1; pointer-events: auto; }
  .sheet-open .sheet { transform: none; }
  .grabber { width: 40px; height: 4px; border-radius: 2px; background: var(--surface-2); margin: 0 auto 14px; }
  .sheet-head { display: flex; align-items: baseline; justify-content: space-between; }
  .sheet-title { font-size: 22px; font-weight: 800; }
  .sheet-sub { color: var(--muted); font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 16px; }
  .chip { font-size: 12px; padding: 5px 10px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
  .chip .ar { color: var(--text); font-size: 14px; margin-left: 4px; }
  .pages { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
  .page {
    height: 46px; border-radius: 12px; background: var(--surface-2);
    font-weight: 700; font-size: 14px; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: background .15s, color .15s, transform .1s;
  }
  .page:active { transform: scale(.93); }
  .page small { font-size: 9px; font-weight: 600; opacity: .8; max-width: 90%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .page.on { background: var(--gold); color: #1B1206; }
  .sheet-actions { display: flex; gap: 8px; margin-top: 16px; }
  .sheet-actions .btn { flex: 1; }

  /* ---------- toast ---------- */
  .toast {
    position: fixed; left: 50%; top: 18px; z-index: 30;
    transform: translate(-50%, -200%); visibility: hidden;
    transition: transform .35s cubic-bezier(.2,.8,.2,1), visibility 0s .35s;
    background: var(--gold); color: #1B1206; font-weight: 800; font-size: 14px;
    padding: 12px 18px; border-radius: 14px; white-space: nowrap;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  /* ---------- обучение ---------- */
  .intro {
    position: fixed; inset: 0; z-index: 40; background: var(--bg);
    display: none; flex-direction: column;
    padding: 18px 24px calc(28px + env(safe-area-inset-bottom));
  }
  .intro.show { display: flex; }
  .intro-top { display: flex; justify-content: space-between; align-items: center; height: 32px; }
  .intro-count { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .intro-skip { font-size: 14px; font-weight: 600; color: var(--muted); padding: 6px 0 6px 12px; }
  .intro-art { flex: 1; display: grid; place-items: center; }
  .intro-tile {
    width: 132px; height: 132px; border-radius: 40px;
    display: grid; place-items: center;
    animation: pop .4s cubic-bezier(.2,.8,.2,1);
  }
  .intro-tile svg { width: 60px; height: 60px; }
  .intro-tile.gold { background: var(--gold-dim); color: var(--gold); }
  .intro-tile.mint { background: var(--mint-dim); color: var(--mint); }
  .intro-tile.cream { background: rgba(242,236,225,.08); color: var(--text); }
  .intro-tile .flame { width: 64px; height: 64px; }
  .intro-word { font-family: 'Amiri', serif; font-weight: 700; font-size: 120px; line-height: 1; color: var(--gold); animation: pop .4s cubic-bezier(.2,.8,.2,1); }
  @keyframes pop { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
  .intro-body { animation: fade .3s ease; }
  .intro-kicker { font-size: 13px; font-weight: 700; color: var(--gold); margin-bottom: 6px; }
  .intro-title { font-size: 28px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
  .intro-text { font-size: 16px; color: var(--muted); margin-top: 12px; line-height: 1.5; }
  .intro-text b { color: var(--text); font-weight: 700; }
  .dots { display: flex; gap: 6px; margin: 28px 0 18px; }
  .dots i { width: 6px; height: 6px; border-radius: 3px; background: var(--surface-2); transition: width .25s, background .25s; }
  .dots i.on { width: 22px; background: var(--gold); }
  .intro .btn { width: 100%; height: 52px; font-size: 16px; border-radius: 16px; }

  .toast.show { transform: translate(-50%, 0); visibility: visible; transition: transform .35s cubic-bezier(.2,.8,.2,1); }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">Hafiz Tracker</div>
    <button class="help-btn" data-a="help" aria-label="Как пользоваться">?</button>
    <div class="hello">Ассаляму алейкум,</div>
    <div class="name" id="userName">друг</div>
    <div class="hijri" id="hijri"></div>
  </header>

  <main>
    <section class="tab active" id="tab-today"></section>
    <section class="tab" id="tab-progress"></section>
    <section class="tab" id="tab-salah"></section>
  </main>

  <nav class="nav">
    <button data-a="tab" data-tab="today" class="on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2.5Z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H19"/><path d="m9 10 2 2 4-4"/></svg>
      Сегодня
    </button>
    <button data-a="tab" data-tab="progress">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      Прогресс
    </button>
    <button data-a="tab" data-tab="salah">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
      Намазы
    </button>
  </nav>

  <div class="backdrop" data-a="closeSheet"></div>
  <div class="sheet" id="sheet"></div>
  <div class="toast" id="toast"></div>
  <div class="intro" id="intro"></div>
</div>

<script>
/* ============ Данные Корана (Мединский мусхаф, 604 стр.) ============ */
const JUZ_START = [1,22,42,62,82,102,121,142,162,182,201,222,242,262,282,302,322,342,362,382,402,422,442,462,482,502,522,542,562,582];
const TOTAL = 604;
const juzStart = j => JUZ_START[j - 1];
const juzEnd = j => j === 30 ? TOTAL : JUZ_START[j] - 1;
const juzOf = p => { let j = 1; while (j < 30 && JUZ_START[j] <= p) j++; return j; };

// [русское название, арабское, первая страница]
const SURAHS = [
  ["Аль-Фатиха","الفاتحة",1],["Аль-Бакара","البقرة",2],["Аль Имран","آل عمران",50],["Ан-Ниса","النساء",77],
  ["Аль-Маида","المائدة",106],["Аль-Анам","الأنعام",128],["Аль-Араф","الأعراف",151],["Аль-Анфаль","الأنفال",177],
  ["Ат-Тауба","التوبة",187],["Юнус","يونس",208],["Худ","هود",221],["Юсуф","يوسف",235],
  ["Ар-Раад","الرعد",249],["Ибрахим","إبراهيم",255],["Аль-Хиджр","الحجر",262],["Ан-Нахль","النحل",267],
  ["Аль-Исра","الإسراء",282],["Аль-Кахф","الكهف",293],["Марьям","مريم",305],["Та Ха","طه",312],
  ["Аль-Анбия","الأنبياء",322],["Аль-Хаджж","الحج",332],["Аль-Муминун","المؤمنون",342],["Ан-Нур","النور",350],
  ["Аль-Фуркан","الفرقان",359],["Аш-Шуара","الشعراء",367],["Ан-Намль","النمل",377],["Аль-Касас","القصص",385],
  ["Аль-Анкабут","العنكبوت",396],["Ар-Рум","الروم",404],["Лукман","لقمان",411],["Ас-Саджда","السجدة",415],
  ["Аль-Ахзаб","الأحزاب",418],["Саба","سبأ",428],["Фатир","فاطر",434],["Ясин","يس",440],
  ["Ас-Саффат","الصافات",446],["Сад","ص",453],["Аз-Зумар","الزمر",458],["Гафир","غافر",467],
  ["Фуссилят","فصلت",477],["Аш-Шура","الشورى",483],["Аз-Зухруф","الزخرف",489],["Ад-Духан","الدخان",496],

};

const pad = n => String(n).padStart(2, '0');
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayKey = () => dayKey(new Date());
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return d; };
const getDay = k => state.days[k] || { sp: [], k: 0, m: 0, p: '00000' };
const ensureDay = k => (state.days[k] = state.days[k] || { sp: [], k: 0, m: 0, p: '00000' });
const isActive = d => d.sp.length > 0 || d.k || d.m;
const memorizedCount = () => state.pages.reduce((a, b) => a + b, 0);
const juzCount = j => { let c = 0; for (let p = juzStart(j); p <= juzEnd(j); p++) c += state.pages[p]; return c; };
const juzSize = j => juzEnd(j) - juzStart(j) + 1;

/* ============ Хранилище: CloudStorage Telegram + localStorage ============ */
const dirtyDays = new Set();
let saveTimer = null;

function serializeCore() {
  return JSON.stringify({ v: 1, pg: state.pages.slice(1).join(''), r: state.recent.slice(-40), o: state.order, jr: state.juzRev, si: state.seenIntro ? 1 : 0 });
}
function applyCore(raw) {
  const c = JSON.parse(raw);
  if (c.pg) state.pages = [0, ...c.pg.split('').map(Number)];
  state.recent = c.r || [];
  state.order = c.o || 'back';
  state.juzRev = c.jr || {};
  state.seenIntro = !!c.si;
}

const cloud = {
  keys: () => new Promise((res, rej) => tg.CloudStorage.getKeys((e, v) => e ? rej(e) : res(v))),
  get: keys => new Promise((res, rej) => tg.CloudStorage.getItems(keys, (e, v) => e ? rej(e) : res(v))),
  set: (k, v) => new Promise((res, rej) => tg.CloudStorage.setItem(k, v, (e, ok) => e ? rej(e) : res(ok))),
  remove: keys => new Promise((res, rej) => tg.CloudStorage.removeItems(keys, (e, ok) => e ? rej(e) : res(ok)))
};

async function load() {
  try {
    const local = JSON.parse(localStorage.getItem('hafiz') || 'null');
    if (local) { applyCore(local.core); state.days = local.days || {}; }
  } catch (e) {}
  if (!hasCloud) return;
  try {
    const keys = await cloud.keys();
    if (!keys.includes('core')) return;
    const dayKeys = keys.filter(k => k.startsWith('d_')).sort().slice(-120);
    const vals = await cloud.get(['core', ...dayKeys]);
    applyCore(vals.core);
    state.days = {};
    for (const k of dayKeys) if (vals[k]) state.days[k.slice(2)] = JSON.parse(vals[k]);
  } catch (e) { console.warn('cloud load failed', e); }
}

function save(dayK) {
  if (dayK) dirtyDays.add(dayK);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 350);
}
async function flush() {
  const core = serializeCore();
  try { localStorage.setItem('hafiz', JSON.stringify({ core, days: state.days })); } catch (e) {}
  if (!hasCloud) return;
  const days = [...dirtyDays]; dirtyDays.clear();
  try {
    await cloud.set('core', core);
    for (const k of days) await cloud.set('d_' + k, JSON.stringify(state.days[k]));
  } catch (e) { console.warn('cloud save failed', e); }
}

/* ============ Логика ============ */
function nextPage() {
  const order = state.order === 'back'
    ? [].concat(...Array.from({ length: 30 }, (_, i) => 30 - i).map(j => range(juzStart(j), juzEnd(j))))
    : range(1, TOTAL);
  return order.find(p => !state.pages[p]) || null;
}
function range(a, b) { const r = []; for (let i = a; i <= b; i++) r.push(i); return r; }

function compress(list) {
  const s = [...new Set(list)].sort((a, b) => a - b);
  const out = [];
  for (let i = 0; i < s.length; i++) {
    let j = i; while (j + 1 < s.length && s[j + 1] === s[j] + 1) j++;
    out.push(i === j ? `${s[i]}` : `${s[i]}–${s[j]}`); i = j;
  }
  return out.join(', ');
}

function sabkiPages() {
  const todays = new Set(getDay(todayKey()).sp);
  return state.recent.filter(p => !todays.has(p) && state.pages[p]).slice(-5);
}

function manzilJuz() {
  const cands = range(1, 30).filter(j => juzCount(j) > 0);
  if (!cands.length) return null;
  return cands.sort((a, b) => (state.juzRev[a] || '').localeCompare(state.juzRev[b] || ''))[0];
}

function streak(test) {
  let n = 0, i = test(getDay(todayKey())) ? 0 : 1;
  while (test(getDay(dayKey(daysAgo(i))))) { n++; i++; }
  return n;
}

function pace() {
  let sum = 0;
  for (let i = 0; i < 28; i++) sum += getDay(dayKey(daysAgo(i))).sp.length;
  return sum / 28; // страниц в день
}

function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}

function maybeCelebrate(k) {
  const d = getDay(k);

}

  const d = getDay(todayKey());
  const done = d.p.split('').filter(x => x === '1').length;
  const fullStreak = streak(x => x.p === '11111');
  const wd = ['вс','пн','вт','ср','чт','пт','сб'];
  const rows = range(0, 6).map(i => {
    const dt = daysAgo(i), x = getDay(dayKey(dt));
    return `<div class="d ${i === 0 ? 't' : ''}">${i === 0 ? 'сег.' : wd[dt.getDay()] + ' ' + dt.getDate()}</div>` +
      x.p.split('').map(b => `<div class="c ${b === '1' ? 'on' : ''}"></div>`).join('');
  }).join('');

  document.getElementById('tab-salah').innerHTML = `
    <div class="salah-sum">
      <span class="big">${done}</span><span class="of">из 5 сегодня</span>
      <span class="streak-mini">Все 5 подряд: <b>${fullStreak} ${plural(fullStreak, 'день', 'дня', 'дней')}</b></span>
    </div>
    ${PRAYERS.map((p, i) => `
      <button class="card prayer ${d.p[i] === '1' ? 'done' : ''}" data-a="prayer" data-i="${i}" style="width:100%;text-align:left">
        <div class="check">${ICON.check}</div>
        <span class="prayer-name">${p[0]}</span>
        <span class="prayer-ar ar">${p[1]}</span>
      </button>`).join('')}

    <div class="section-title">Последние 7 дней</div>
    <div class="card">
      <div class="sgrid">
        <div></div>${PRAYERS.map(p => `<div class="h">${p[0][0]}</div>`).join('')}
        ${rows}
      </div>
    </div>
  `;
}

/* ============ Обучение ============ */
const INTRO = [
  {
    art: '<div class="intro-word">حفظ</div>',
    kicker: 'Добро пожаловать',
    title: 'Дневник твоего хифза',
    text: 'Каждый день отмечай, что <b>выучил</b> и что <b>повторил</b>. Приложение покажет, сколько Корана уже в сердце и сколько осталось до хафиза.'
  },
  {
    art: () => `<div class="intro-tile gold">${ICON.book}</div>`,
    kicker: 'Шаг 1 · Сабак',
    title: 'Новый урок',
    text: 'Выучил новую страницу и сдал устазу — нажми <b>«+ Страница»</b>. Приложение само подскажет, какая страница следующая и из какой она суры.'
  },
  {
    art: () => `<div class="intro-tile mint">${ICON.repeat}</div>`,
    kicker: 'Шаг 2 · Сабки',
    title: 'Повтор недавнего',
    text: 'Повтори <b>последние 5 выученных страниц</b>, чтобы они закрепились. Прочитал — нажми на карточку, появится зелёная галочка.'
  },
  {
    art: () => `<div class="intro-tile cream">${ICON.layers}</div>`,
    kicker: 'Шаг 3 · Манзиль',
    title: 'Повтор старого',
    text: 'Каждый день — <b>один старый джуз</b>. Приложение выбирает тот, который ты дольше всего не повторял, чтобы ничего не забылось.'
  },
  {
    art: () => `<div class="intro-tile gold">${ICON.flame}</div>`,
    kicker: 'Шаг 4 · Серия',
    title: 'Не прерывай цепочку',
    text: 'Уже знаешь часть Корана — отметь её на вкладке <b>«Прогресс»</b>. Во вкладке <b>«Намазы»</b> — 5 отметок в день. Каждый день с уроком или повтором добавляет огонёк в серию.'
  }
];
let introStep = 0;

function renderIntro() {
  const s = INTRO[introStep], last = introStep === INTRO.length - 1;
  document.getElementById('intro').innerHTML = `
    <div class="intro-top">
      <span class="intro-count">${introStep + 1} / ${INTRO.length}</span>
      ${last ? '' : '<button class="intro-skip" data-a="introDone">Пропустить</button>'}
    </div>
    <div class="intro-art">${typeof s.art === 'function' ? s.art() : s.art}</div>
    <div class="intro-body">
      <div class="intro-kicker">${s.kicker}</div>
      <div class="intro-title">${s.title}</div>
      <div class="intro-text">${s.text}</div>
    </div>
    <div class="dots">${INTRO.map((_, i) => `<i class="${i === introStep ? 'on' : ''}"></i>`).join('')}</div>
    <button class="btn btn-gold" data-a="introNext">${last ? 'Бисмиллях, начать' : 'Далее'}</button>`;
}
function openIntro() {
  introStep = 0; renderIntro();
  document.getElementById('intro').classList.add('show');
}
function closeIntro() {
  document.getElementById('intro').classList.remove('show');
  if (!state.seenIntro) { state.seenIntro = true; save(); }
}

/* ============ Действия ============ */
function renderAll() { renderToday(); renderProgress(); renderSalah(); renderSheet(); }

const actions = {
  tab(el) {
    const t = el.dataset.tab;
    document.querySelectorAll('.tab').forEach(s => s.classList.toggle('active', s.id === 'tab-' + t));
    document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
    window.scrollTo({ top: 0 });
    haptic('light');
  },
  sabakAdd() {
    const p = nextPage(); if (!p) return;
    const k = todayKey(), d = ensureDay(k);
    state.pages[p] = 1; state.recent.push(p); d.sp.push(p);
    haptic('medium'); maybeCelebrate(k); save(k); renderAll();
  },
  sabakUndo() {
    const k = todayKey(), d = ensureDay(k);
    const p = d.sp.pop(); if (!p) return;
    state.pages[p] = 0; state.recent = state.recent.filter(x => x !== p); d.c = 0;
    haptic('light'); save(k); renderAll();
  },
  sabki() {
    const k = todayKey(), d = ensureDay(k);
    d.k = d.k ? 0 : 1; if (!d.k) d.c = 0;
    haptic(d.k ? 'medium' : 'light'); maybeCelebrate(k); save(k); renderAll();
  },
  manzil(el) {
    const k = todayKey(), d = ensureDay(k), j = el.dataset.j;
    if (d.m) { d.m = 0; d.c = 0; if (d.prevRev !== undefined) { state.juzRev[j] = d.prevRev; } delete d.mj; delete d.prevRev; }
    else { d.m = 1; d.mj = j; d.prevRev = state.juzRev[j] || ''; state.juzRev[j] = k; }
    if (state.juzRev[j] === '') delete state.juzRev[j];
    haptic(d.m ? 'medium' : 'light'); maybeCelebrate(k); save(k); renderAll();
  },
  help() { haptic('light'); openIntro(); },
  introNext() {
    haptic('light');
    if (introStep < INTRO.length - 1) { introStep++; renderIntro(); }
    else { haptic('success'); closeIntro(); }
  },
  introDone() { haptic('light'); closeIntro(); },
  openJuz(el) { haptic('light'); openSheet(+el.dataset.j); },
  closeSheet() { closeSheet(); },
  togglePage(el) {
    const p = +el.dataset.p;
    state.pages[p] = state.pages[p] ? 0 : 1;
    if (state.pages[p]) state.recent.push(p); else state.recent = state.recent.filter(x => x !== p);
    haptic('light'); save(); renderAll();
  },
  juzSet(el) {
    const j = +el.dataset.j, v = +el.dataset.v;
    for (let p = juzStart(j); p <= juzEnd(j); p++) {
      if (v && !state.pages[p]) state.recent.push(p);
      state.pages[p] = v;
    }
    if (!v) state.recent = state.recent.filter(p => state.pages[p]);
    haptic(v ? 'success' : 'light'); save(); renderAll();
  },
  order(el) { state.order = el.dataset.v; haptic('light'); save(); renderAll(); },
  reset() {
    const doReset = ok => {
      if (!ok) return;
      const keys = Object.keys(state.days).map(k => 'd_' + k);
      state.pages = new Array(TOTAL + 1).fill(0); state.recent = []; state.juzRev = {}; state.days = {};
      try { localStorage.removeItem('hafiz'); } catch (e) {}
      if (hasCloud && keys.length) cloud.remove(keys).catch(() => {});
      save(); renderAll();
    };
    if (inTg && tg.showConfirm) tg.showConfirm('Удалить весь прогресс? Это нельзя отменить.', doReset);
    else doReset(confirm('Удалить весь прогресс? Это нельзя отменить.'));
  },
  prayer(el) {
    const k = todayKey(), d = ensureDay(k), i = +el.dataset.i;
    const arr = d.p.split(''); arr[i] = arr[i] === '1' ? '0' : '1'; d.p = arr.join('');
    if (d.p === '11111') { haptic('success'); toast('Все 5 намазов. Да примет Аллах!'); } else haptic(arr[i] === '1' ? 'medium' : 'light');
    save(k); renderAll();
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (el && actions[el.dataset.a]) actions[el.dataset.a](el);
});

/* ============ Старт ============ */
(async function init() {
  if (tg) {
    try {
      tg.ready(); tg.expand();
      tg.setHeaderColor('#071317'); tg.setBackgroundColor('#071317');
      if (tg.setBottomBarColor) tg.setBottomBarColor('#071317');
      if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
      tg.BackButton.onClick(closeSheet);
    } catch (e) {}
    const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
    if (u && u.first_name) document.getElementById('userName').textContent = u.first_name;
  }
  try {
    const parts = new Intl.DateTimeFormat('ru-RU-u-ca-islamic-umalqura', { day: 'numeric', month: 'long', year: 'numeric' })
      .formatToParts(new Date());
    const part = t => (parts.find(x => x.type === t) || {}).value || '';
    document.getElementById('hijri').textContent = `${part('day')} ${part('month')} ${part('year')} г. х.`;
  } catch (e) {}
  await load();
  renderAll();
  if (!state.seenIntro) openIntro();
})();
</script>
